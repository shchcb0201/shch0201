<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>靠北/告白興附</title>
  <style>
    /* 簡約白基礎樣式 */
    :root {
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --text-main: #2b2b2b;
      --text-sub: #666666;
      --border-color: #eaeaea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 20px;
    }

    /* 左上角標題 */
    header {
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }
    
    .site-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    /* 卡片容器 */
    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      color: var(--text-main);
    }

    /* 守則條列 */
    .rules-list {
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--text-sub);
      background: #f8f9fa;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .rules-list li {
      list-style: none;
      margin-bottom: 6px;
    }

    /* 彩色暈染按鈕樣式 */
    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      position: relative;
      padding: 12px 28px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      border-radius: 30px;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: radial-gradient(circle, rgba(255,182,193,0.8) 0%, rgba(173,216,230,0.8) 50%, rgba(255,222,173,0.8) 100%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease, opacity 0.6s ease;
      opacity: 0;
      z-index: 0;
    }

    .btn:active::before {
      width: 250px;
      height: 250px;
      opacity: 1;
      transition: 0s;
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .btn:hover {
      border-color: #ccc;
      transform: translateY(-1px);
    }

    /* 輸入區與字數限制 */
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      resize: none;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 8px;
    }

    textarea:focus {
      border-color: #aaa;
    }

    .char-count {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    /* 隱藏區塊 */
    .hidden {
      display: none;
    }

    /* 成功畫面 */
    .success-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- 左上角標題 -->
  <header>
    <div class="site-title">靠北/告白興附</div>
  </header>

  <main class="container">
    <!-- 第一頁：社群守則與選擇 -->
    <div id="step-rules">
      <h2>📜 社群守則</h2>
      <ul class="rules-list">
        <li>🚫 嚴禁人身攻擊、霸凌與公審行為</li>
        <li>🧼 禁止洗版、大量重複發送相同內容</li>
        <li>❌ 嚴禁散布未經證實的虛假消息與謠言</li>
        <li>🔒 請尊重他人隱私，切勿公開個人敏感資料</li>
        <li>✨ 讓我們一起維護友善溫馨的投稿環境！</li>
      </ul>
      <div class="btn-group">
        <button class="btn" onclick="startPost('告白')"><span>💖 告白</span></button>
        <button class="btn" onclick="startPost('靠北')"><span>📢 靠北</span></button>
      </div>
    </div>

    <!-- 第二頁：內容輸入 -->
    <div id="step-input" class="hidden">
      <h2 id="post-type-title">匿名投稿</h2>
      <textarea id="post-content" maxlength="70" placeholder="寫下想說的話...（最多70字）" oninput="updateCharCount()"></textarea>
      <div class="char-count"><span id="current-count">0</span> / 70 字</div>
      <div class="btn-group">
        <button class="btn" onclick="submitPost()"><span>下一步 🚀</span></button>
      </div>
    </div>

    <!-- 第三頁：感謝投稿 -->
    <div id="step-thanks" class="hidden">
      <div class="success-icon">🎉</div>
      <h2>感謝你的匿名投稿！</h2>
      <p style="color: var(--text-sub); font-size: 0.9rem; margin-top: 8px;">內容已成功傳送，我們將會在5~10天內上傳貼文</p>
    </div>
  </main>

  <script>
    // ⚠️ 請填入你的 Formspree 連結（例如 https://formspree.io/f/xknwxyza）
    const FORMSPREE_URL = "https://formspree.io/f/xjyvnvjr"; 

    let selectedType = "";

    function startPost(type) {
      selectedType = type;
      document.getElementById("post-type-title").innerText = `【${type}】匿名投稿`;
      document.getElementById("step-rules").classList.add("hidden");
      document.getElementById("step-input").classList.remove("hidden");
    }

    function updateCharCount() {
      const content = document.getElementById("post-content").value;
      document.getElementById("current-count").innerText = content.length;
    }

    async function submitPost() {
      const content = document.getElementById("post-content").value.trim();

      if (!content) {
        alert("請輸入投稿內容！");
        return;
      }

      // 如果還沒設定 Formspree，做測試模擬
      if (FORMSPREE_URL === "YOUR_FORMSPREE_ENDPOINT") {
        console.log("模擬送出成功！投稿類型：", selectedType, "內容：", content);
        showSuccess();
        return;
      }

      try {
        const response = await fetch(FORMSPREE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            投稿類型: selectedType,
            投稿內容: content,
            發送時間: new Date().toLocaleString()
          })
        });

        if (response.ok) {
          showSuccess();
        } else {
          alert("投稿失敗，請稍後再試！");
        }
      } catch (error) {
        alert("網路發生錯誤，投稿失敗。");
      }
    }

    function showSuccess() {
      document.getElementById("step-input").classList.add("hidden");
      document.getElementById("step-thanks").classList.remove("hidden");
    }
  </script>
</body>
</html>
